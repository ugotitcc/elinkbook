services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PB_VERSION: ${PB_VERSION:-0.39.10}
    container_name: ${CONTAINER_NAME:-elinkbook-pocketbase}
    volumes:
      - ${DATA_PATH:-./pb_data}:/pb/pb_data
      - ${HOOKS_PATH:-./pb_hooks}:/pb/pb_hooks
      - ${MIGRATIONS_PATH:-./pb_migrations}:/pb/pb_migrations
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${POCKETBASE_TRAEFIK_ROUTERS_NAME}.entrypoints=${HTTP_ENTRY_POINTS}'
      - 'traefik.http.routers.${POCKETBASE_TRAEFIK_ROUTERS_NAME}.rule=Host(`${POCKETBASE_HOST_NAME}`)'
      - 'traefik.http.services.${POCKETBASE_TRAEFIK_ROUTERS_NAME}.loadbalancer.server.port=${LOADBALANCER_SERVER_PORT}'
    restart: unless-stopped
networks:
  default:
    external: true
    name: ${PROXY_NETWORK}