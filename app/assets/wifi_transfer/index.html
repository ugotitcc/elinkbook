<!DOCTYPE html>
<html lang="__WIFI_PAGE_LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle"></title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background: #f5f5f5;
    color: #222;
  }
  h1 { font-size: 20px; }
  section {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .placeholder { color: #888; }
  .book-item { display: block; padding: 4px 0; }
  button { font-size: 14px; padding: 8px 16px; margin-top: 8px; }
  #upload-dropzone {
    border: 2px dashed #aaa;
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    color: #666;
  }
  #upload-dropzone.dragover { border-color: #333; background: #f0f0f0; }
  #upload-dropzone label { text-decoration: underline; cursor: pointer; }
  #upload-progress { display: none; width: 100%; margin-top: 8px; }
  #upload-result-list { list-style: none; padding: 0; margin: 8px 0 0; }
  #upload-result-list li { padding: 4px 0; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(0, 0, 0, 0.2);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #upload-dropzone.disabled {
    opacity: 0.5;
    pointer-events: none;
    cursor: not-allowed;
    background: #f9f9f9;
  }
  #upload-status-container {
    display: none;
    margin-top: 8px;
    font-size: 13px;
    color: #444;
  }
  #download-search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 4px;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .toolbar button {
    font-size: 12px;
    padding: 4px 10px;
    margin: 0;
  }
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid #eee;
    font-size: 13px;
  }
  .pagination button {
    font-size: 12px;
    padding: 4px 12px;
    margin: 0;
  }
</style>
</head>
<body>
  <h1 data-i18n="pageTitle"></h1>
  <section id="upload-section">
    <h2 data-i18n="uploadHeading"></h2>
    <div id="upload-dropzone">
      <span data-i18n="dropzoneText"></span>
      <label for="upload-file-input" data-i18n="chooseFile"></label>
    </div>
    <input id="upload-file-input" type="file" multiple style="display: none;">
    <progress id="upload-progress" value="0" max="100"></progress>
    <div id="upload-status-container">
      <span id="upload-status-spinner" class="spinner" style="display: none;"></span>
      <span id="upload-status-text"></span>
      <span id="upload-bytes-text" style="float: right; color: #666;"></span>
      <div style="clear: both;"></div>
    </div>
    <ul id="upload-result-list"></ul>
  </section>
  <section id="download-section">
    <h2 data-i18n="downloadHeading"></h2>
    <input id="download-search-input" type="text" data-i18n-placeholder="searchPlaceholder">
    <div id="download-search-stats" style="font-size: 12px; color: #666; margin-bottom: 8px;"></div>
    <div class="toolbar">
      <button id="download-select-page-button" type="button" data-i18n="selectPage"></button>
      <button id="download-clear-selection-button" type="button" data-i18n="clearSelection"></button>
      <span id="download-selection-count" style="color: #666;"></span>
    </div>
    <div id="download-list" class="placeholder" data-i18n="loading"></div>
    <div id="download-pagination" class="pagination" style="display: none;">
      <button id="download-prev-page-button" type="button" data-i18n="prevPage"></button>
      <span id="download-page-info"></span>
      <button id="download-next-page-button" type="button" data-i18n="nextPage"></button>
    </div>
    <div style="margin-top: 12px;">
      <button id="download-selected-button" type="button" data-i18n="downloadSelected"></button>
      <p id="download-status" class="placeholder" style="margin: 6px 0 0;"></p>
    </div>
  </section>
  <script>
    // 字典由 App 內建 HTTP Server 依瀏覽器 Accept-Language 挑語言後注入
    // （wifi_transfer_page.dart）。帶參數的訊息以 {名稱} 標記，t() 單趟代入。
    const I18N = __WIFI_PAGE_I18N__;
    function t(key, params) {
      const template = I18N[key];
      if (!params) return template;
      return template.replace(/\{(\w+)\}/g, (match, name) =>
        Object.prototype.hasOwnProperty.call(params, name) ? String(params[name]) : match
      );
    }
    for (const el of document.querySelectorAll('[data-i18n]')) {
      el.textContent = t(el.dataset.i18n);
    }
    for (const el of document.querySelectorAll('[data-i18n-placeholder]')) {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    }

    function formatBytes(bytes) {
      if (bytes == null) return '';
      if (bytes < 1024) return ' (' + bytes + ' B)';
      if (bytes < 1024 * 1024) return ' (' + (bytes / 1024).toFixed(1) + ' KB)';
      return ' (' + (bytes / (1024 * 1024)).toFixed(1) + ' MB)';
    }

    const PAGE_SIZE = 20;
    let allBooks = [];
    let filteredBooks = [];
    const selectedBookIds = new Set();
    let currentPage = 1;

    function updateSelectionCount() {
      const countEl = document.getElementById('download-selection-count');
      countEl.textContent = t('selectedCount', { count: selectedBookIds.size });
    }

    function renderPage() {
      const listEl = document.getElementById('download-list');
      const paginationEl = document.getElementById('download-pagination');
      const prevBtn = document.getElementById('download-prev-page-button');
      const nextBtn = document.getElementById('download-next-page-button');
      const pageInfo = document.getElementById('download-page-info');

      if (filteredBooks.length === 0) {
        listEl.textContent = allBooks.length === 0 ? t('noBooks') : t('noMatch');
        listEl.className = 'placeholder';
        paginationEl.style.display = 'none';
        updateSelectionCount();
        return;
      }

      listEl.className = '';
      listEl.innerHTML = '';

      const totalPages = Math.ceil(filteredBooks.length / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageBooks = filteredBooks.slice(start, start + PAGE_SIZE);

      for (const book of pageBooks) {
        const label = document.createElement('label');
        label.className = 'book-item';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = book.id;
        checkbox.className = 'download-book-checkbox';
        checkbox.checked = selectedBookIds.has(book.id);
        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            selectedBookIds.add(book.id);
          } else {
            selectedBookIds.delete(book.id);
          }
          updateSelectionCount();
        });
        label.appendChild(checkbox);
        label.appendChild(
          document.createTextNode(' ' + book.title + formatBytes(book.sizeBytes))
        );
        listEl.appendChild(label);
      }

      if (totalPages > 1) {
        paginationEl.style.display = 'flex';
        prevBtn.disabled = (currentPage === 1);
        nextBtn.disabled = (currentPage === totalPages);
        pageInfo.textContent = t('pageInfo', { page: currentPage, total: totalPages });
      } else {
        paginationEl.style.display = 'none';
      }
      updateSelectionCount();
    }

    function applyFilter() {
      const searchInput = document.getElementById('download-search-input');
      const statsEl = document.getElementById('download-search-stats');
      const query = (searchInput.value || '').trim().toLowerCase();

      if (!query) {
        filteredBooks = allBooks.slice();
        statsEl.textContent = allBooks.length > 0 ? t('totalBooks', { count: allBooks.length }) : '';
      } else {
        filteredBooks = allBooks.filter((book) =>
          (book.title || '').toLowerCase().includes(query)
        );
        statsEl.textContent = t('matchStats', { matched: filteredBooks.length, total: allBooks.length });
      }
      currentPage = 1;
      renderPage();
      updateSelectionCount();
    }

    async function loadDownloadableBooks() {
      const listEl = document.getElementById('download-list');
      try {
        const response = await fetch('/api/books');
        allBooks = await response.json();
        // 【`/receiving-code-review` 審查修正 I-4】清理已不存在的書籍 ID 勾選
        const freshIds = new Set(allBooks.map((b) => b.id));
        for (const id of [...selectedBookIds]) {
          if (!freshIds.has(id)) {
            selectedBookIds.delete(id);
          }
        }
        applyFilter();
      } catch (err) {
        listEl.textContent = t('loadFailed');
        listEl.className = 'placeholder';
      }
    }

    // 全選目前頁
    document
      .getElementById('download-select-page-button')
      .addEventListener('click', () => {
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageBooks = filteredBooks.slice(start, start + PAGE_SIZE);
        for (const book of pageBooks) {
          selectedBookIds.add(book.id);
        }
        renderPage();
        updateSelectionCount();
      });

    // 清除勾選
    document
      .getElementById('download-clear-selection-button')
      .addEventListener('click', () => {
        selectedBookIds.clear();
        renderPage();
        updateSelectionCount();
      });

    // 上一頁 / 下一頁
    document
      .getElementById('download-prev-page-button')
      .addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderPage();
        }
      });
    document
      .getElementById('download-next-page-button')
      .addEventListener('click', () => {
        const totalPages = Math.ceil(filteredBooks.length / PAGE_SIZE);
        if (currentPage < totalPages) {
          currentPage++;
          renderPage();
        }
      });

    // 搜尋即時輸入過濾
    document
      .getElementById('download-search-input')
      .addEventListener('input', applyFilter);

    // 下載已勾選書籍（從 selectedBookIds 下載所有選中項目，不受當前分頁或過濾限制）
    async function downloadSelectedBooks() {
      const statusEl = document.getElementById('download-status');
      const button = document.getElementById('download-selected-button');
      if (selectedBookIds.size === 0) {
        statusEl.textContent = t('selectAtLeastOne');
        return;
      }
      button.disabled = true;
      statusEl.textContent = t('downloading');
      try {
        // 【`/receiving-code-review` 審查修正 M-2】建立不可變陣列快照，避免下載期間被「清除勾選」異動
        const bookIds = [...selectedBookIds];
        for (const bookId of bookIds) {
          const link = document.createElement('a');
          link.href = '/api/books/' + encodeURIComponent(bookId) + '/download';
          link.download = '';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          await new Promise((resolve) => setTimeout(resolve, 300));
        }
        statusEl.textContent = t('downloadTriggered', { count: bookIds.length });
      } finally {
        button.disabled = false;
      }
    }

    document
      .getElementById('download-selected-button')
      .addEventListener('click', downloadSelectedBooks);

    updateSelectionCount();
    loadDownloadableBooks();

    // 對應 UploadOutcome 四個值（wifi_transfer_service.dart）的顯示文案。
    const UPLOAD_OUTCOME_LABELS = {
      imported: t('outcomeImported'),
      duplicateSkipped: t('outcomeDuplicateSkipped'),
      unsupportedFormat: t('outcomeUnsupportedFormat'),
      failed: t('outcomeFailed'),
    };

    // 【`/receiving-code-review` 審查修正 I-2】無括號短格式容量顯示，供上傳進度列使用
    function formatBytesShort(bytes) {
      if (bytes == null) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function uploadFiles(fileList) {
      if (fileList.length === 0) return;
      const dropzoneEl = document.getElementById('upload-dropzone');
      // 【`/receiving-code-review` 審查修正 M-1】防重入：若拖放區已處於 disabled 狀態則直接返回
      if (dropzoneEl.classList.contains('disabled')) return;

      const formData = new FormData();
      for (const file of fileList) {
        formData.append('files', file, file.name);
      }
      const fileInputEl = document.getElementById('upload-file-input');
      const progressEl = document.getElementById('upload-progress');
      const statusContainer = document.getElementById('upload-status-container');
      const statusSpinner = document.getElementById('upload-status-spinner');
      const statusText = document.getElementById('upload-status-text');
      const bytesText = document.getElementById('upload-bytes-text');
      const resultListEl = document.getElementById('upload-result-list');

      // 【`/receiving-code-review` 審查修正 M-3】設置 aria-disabled
      dropzoneEl.classList.add('disabled');
      dropzoneEl.setAttribute('aria-disabled', 'true');
      fileInputEl.disabled = true;
      progressEl.style.display = '';
      progressEl.value = 0;
      statusContainer.style.display = 'block';
      statusSpinner.style.display = 'none';
      statusText.textContent = t('uploadPreparing');
      bytesText.textContent = '';
      resultListEl.innerHTML = '';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.upload.onprogress = (event) => {
        if (event.lengthComputable && event.total > 0) {
          const percent = (event.loaded / event.total) * 100;
          progressEl.value = percent;
          if (event.loaded < event.total) {
            statusText.textContent = t('uploadingPercent', { percent: Math.round(percent) });
            bytesText.textContent = formatBytesShort(event.loaded) + ' / ' + formatBytesShort(event.total);
          } else {
            // 上傳位元組已傳輸完畢，進入手機端計算指紋與匯入階段
            statusSpinner.style.display = 'inline-block';
            statusText.textContent = t('uploadProcessing');
            bytesText.textContent = formatBytesShort(event.total);
          }
        } else {
          // 【`/receiving-code-review` 審查修正 I-3】降級處理：無法預知總量時顯示已傳量與不確定進度條
          statusText.textContent = t('uploading');
          bytesText.textContent = formatBytesShort(event.loaded) + ' / ' + t('unknownSize');
          progressEl.removeAttribute('value');
        }
      };

      // 【`/receiving-code-review` 審查修正 M-4】上傳位元組完畢時兜底切換至轉圈與處理中提示，避免 onprogress 節流遺漏
      xhr.upload.onload = () => {
        statusSpinner.style.display = 'inline-block';
        statusText.textContent = t('uploadProcessing');
      };

      const cleanup = () => {
        dropzoneEl.classList.remove('disabled');
        dropzoneEl.removeAttribute('aria-disabled');
        fileInputEl.disabled = false;
        progressEl.style.display = 'none';
        statusContainer.style.display = 'none';
        statusSpinner.style.display = 'none';
      };

      xhr.onload = () => {
        cleanup();
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            const results = JSON.parse(xhr.responseText);
            if (Array.isArray(results)) {
              let hasImported = false;
              for (const result of results) {
                const li = document.createElement('li');
                const label = UPLOAD_OUTCOME_LABELS[result.outcome] || result.outcome;
                li.textContent = t('uploadResultLine', {
                  name: result.originalFileName || t('unknownFileName'),
                  outcome: label,
                });
                resultListEl.appendChild(li);
                if (result.outcome === 'imported') hasImported = true;
              }
              if (hasImported) loadDownloadableBooks();
              return;
            }
          } catch (err) {}
        }
        const li = document.createElement('li');
        li.textContent = xhr.status
          ? t('uploadFailedServer', { status: xhr.status })
          : t('uploadFailedParse');
        resultListEl.appendChild(li);
      };

      xhr.onerror = () => {
        cleanup();
        const li = document.createElement('li');
        li.textContent = t('uploadFailedNetwork');
        resultListEl.appendChild(li);
      };

      // 【`/receiving-code-review` 審查修正 M-3】上傳中斷與逾時時確保解鎖 UI 狀態
      xhr.onabort = () => {
        cleanup();
        const li = document.createElement('li');
        li.textContent = t('uploadAborted');
        resultListEl.appendChild(li);
      };
      xhr.ontimeout = () => {
        cleanup();
        const li = document.createElement('li');
        li.textContent = t('uploadTimeout');
        resultListEl.appendChild(li);
      };
      xhr.send(formData);
    }

    const uploadFileInput = document.getElementById('upload-file-input');
    uploadFileInput.addEventListener('change', () => {
      uploadFiles(uploadFileInput.files);
      uploadFileInput.value = '';
    });

    const uploadDropzone = document.getElementById('upload-dropzone');
    uploadDropzone.addEventListener('dragover', (event) => {
      event.preventDefault();
      uploadDropzone.classList.add('dragover');
    });
    uploadDropzone.addEventListener('dragleave', () => {
      uploadDropzone.classList.remove('dragover');
    });
    uploadDropzone.addEventListener('drop', (event) => {
      event.preventDefault();
      uploadDropzone.classList.remove('dragover');
      uploadFiles(event.dataTransfer.files);
    });
  </script>
</body>
</html>
