name: elinkbook
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # 多語系介面（epic-45-interface-i18n，FR-49）：Flutter 官方標準方案。
  flutter_localizations:
    sdk: flutter
  intl:

  # 整合測試使用 getTemporaryDirectory() 刪除暫存檔案。
  path_provider: ^2.1.6
  # 固定為 ^11.1.0 而非最新的 ^13.2.1：share_plus >=13.1.0 要求
  # win32 ^6.0.1，與現有 package_info_plus ^9.0.1（要求 win32 ^5.5.3）直接
  # 衝突；把 package_info_plus 升到 >=10.1.0 換取 win32 ^6.0.1 相容，則會
  # 改成跟 file_picker ^11.0.2（要求 win32 ^5.9.0）衝突，file_picker 要到
  # 12.x（beta）才支援 win32 ^6.x。三者無法在不動 file_picker／
  # package_info_plus 版本的前提下同時滿足，^11.1.0 是唯一不需連動升級這兩個
  # 與本功能無關套件的 share_plus 版本。未來若要升級 share_plus，須同時
  # 處理這條 win32 相依鏈。
  #
  # epic-45-interface-i18n Issue 8（review-issue-8.md I-1）：`lib/` 底下
  # 目前沒有任何檔案直接 import `package:share_plus/share_plus.dart`
  # 本身（`notes_bottom_sheet.dart` 已改為直接依賴下方的
  # `share_plus_platform_interface`），但這個套件仍不可移除——
  # `share_plus_platform_interface` 的 `SharePlatform._instance` 預設值
  # 只是 `MethodChannelShare()`，真正讓這個 MethodChannel 在 Android/iOS
  # 上有回應的原生外掛程式碼（`SharePlusPlugin` 等）是由 `share_plus`
  # 套件的 `pubspec.yaml` `flutter: plugin:` 宣告驅動 Flutter 外掛自動
  # 註冊機制產生的，與任何 Dart 檔案是否 import 該套件無關；移除會導致
  # 真機分享功能失效，但 `flutter analyze`／`flutter test` 完全偵測不到。
  share_plus: ^11.1.0
  # `notes_bottom_sheet.dart._exportMarkdown()` 直接依賴此平台介面（而非
  # 透過 `SharePlus.instance` wrapper），避免 `SharePlus.instance` 這個
  # `static final` 欄位在首次存取時快取住當下的 `SharePlatform.instance`，
  # 導致同一個 `flutter test` 執行序列中，後續測試替換 `SharePlatform.
  # instance` 為新的 Fake 後，透過 `SharePlus.instance` 呼叫仍會導向第一個
  # 測試捕獲的舊 Fake（見 `share_plus-11.1.0/lib/share_plus.dart`：
  # `static final SharePlus instance = SharePlus._(SharePlatform.instance);`）。
  # 原本只宣告在 dev_dependencies（測試替身用），Issue 8 起也被生產碼直接
  # import，故移至此正式依賴區塊（review-issue-8.md I-1）。
  share_plus_platform_interface: ^6.1.0
  sqflite: ^2.4.2+1
  # epic-40-bundled-sqlite（ADR 0028）：從 dev_dependencies 移至此，
  # 同時服務正式 Android 建置（透過 databaseFactoryFfi，見 main.dart）與
  # 既有桌面測試環境。其遞移解析的 sqlite3（3.5.0）自 3.x 起改用 Dart
  # 官方 Native Assets 建置掛鉤，建置時自動下載/編譯含 FTS5 的原生函式
  # 庫，取代依賴 Android 系統內建 SQLite（部分裝置系統版本缺 FTS5
  # 模組，見 epic-10-search Issue 6）。不新增 sqlite3_flutter_libs——
  # 該套件僅適用於已淘汰的 sqlite3 2.x 世代。
  sqflite_common_ffi: ^2.4.0+3
  path: ^1.9.1
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  package_info_plus: ^9.0.1
  flutter_inappwebview: ^6.1.5
  uuid: ^4.6.0
  crypto: ^3.0.7
  # PocketBase 同步（epic-8-sync）：官方 Dart SDK。
  pocketbase: ^0.24.0
  # 同步帳號憑證（authToken/userId/email）加密儲存，Android Keystore／
  # iOS Keychain（ADR 0019 決策 3，本專案首次引入的安全性相關儲存機制）。
  flutter_secure_storage: ^10.3.1
  # PDF 引擎（epic-24-pdf-engine-rebuild）：PDFium 透過 dart:ffi 直接呼叫，
  # 取代 android.graphics.pdf.PdfRenderer（ADR 0022）。
  pdfrx: ^2.4.6
  # PDF 導覽熱區（epic-24 Issue 8）_PdfNavZoneTapDetector 用 clock.now() 量測
  # 按壓時長：flutter_test 的 FakeAsync 會攔截 package:clock 的 Zone 覆寫，
  # 讓測試環境下的計時隨 tester.pump() 正確推進，同時正式裝置上一律取得真實
  # 系統時間（不像 SchedulerBinding.currentSystemFrameTimeStamp 只在畫面有新
  # frame 排程時才更新）。
  clock: ^1.1.2
  # CBZ 自然排序與壓縮檔重建（epic-11-multi-format-reader Issue 3）：
  # 由 dev_dependencies 升級為正式 dependency——先前僅供測試 fixture 產生
  # 使用（見 integration_test/foliate_epub_reader_view_test.dart），本 Issue
  # 起成為正式匯入管線的執行期依賴。
  archive: ^4.0.9
  # Markdown YAML Frontmatter 解析（epic-11-multi-format-reader Issue 5）。
  yaml: ^3.1.3
  # Markdown 解析（epic-11-multi-format-reader Issue 5）：Dart 官方純
  # Dart AST 解析器，用於 MD 匯入時的章節/標題階層抽取與 HTML 渲染。
  markdown: ^7.3.1
  # HTML5 容錯解析（epic-11-multi-format-reader Issue 5 審查修復，見
  # reviews/review-issue-5.md Critical #1）：`markdown` 套件對使用者輸入
  # 中裸 HTML（CommonMark/GFM 規範的 raw HTML passthrough）不會跳脫，
  # 用此套件把 `md.renderToHtml()` 的原始輸出容錯解析後重新序列化為合法
  # XML，確保章節 XHTML 一律可被 `epub.js` 的嚴格 XML 解析模式載入。
  html: ^0.15.6
  # OPDS Atom XML 解析（epic-30-calibre-remote-library Issue 1 起使用，
  # 本 Issue 先提升依賴層級）：原僅供測試驗證合成 EPUB 結構的 XML 格式，
  # 現升級為正式匯入管線的執行期依賴。
  xml: ^6.6.1
  # 遠端書庫 HTTP 通訊（epic-30-calibre-remote-library Issue 1 起使用，
  # 本 Issue 先提升依賴層級）：原僅供測試以 MockClient 取代真實網路請求，
  # 現升級為正式匯入管線的執行期依賴。
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  flutter_web_auth_2: ^5.1.0
  # TTS 語音朗讀（epic-34-tts-readalong Issue 2）：系統原生語音合成，見
  # dependency-spike-findings.md 已驗證與現有相依鏈無衝突（minSdk=24，
  # 未拉高專案現有下限）。
  flutter_tts: ^4.2.5
  # TTS 本機音訊播放（epic-34-tts-readalong Issue 2）：見
  # dependency-spike-findings.md，minSdk=16，未拉高專案現有下限。
  just_audio: ^0.10.6
  # TTS 背景播放與系統整合（epic-34-tts-readalong Issue 7）：前景服務、
  # 通知欄/鎖定畫面控制、耳機線控，見 dependency-spike-findings.md，
  # minSdk=19，未拉高專案現有下限。
  audio_service: ^0.18.19
  # TTS 音訊焦點中斷/耳機拔出事件（epic-34-tts-readalong Issue 7）：
  # audio_service 的既有相依，本專案額外顯式宣告以直接呼叫其 API
  # （AudioSession.instance／interruptionEventStream／
  # becomingNoisyEventStream），不依賴透過遞移相依隱式取用。
  audio_session: ^0.2.4
  # 本機 HTTP Server 框架（epic-44-wifi-book-transfer）：官方 Dart 團隊
  # 維護，WiFi 傳書路由/中介層皆用其標準機制，不手刻 socket 處理。
  shelf: ^1.4.2
  # 解析上傳的 multipart/form-data 請求（epic-44-wifi-book-transfer）。
  shelf_multipart: ^2.0.1
  # 畫面上算圖顯示連線用 QR Code（epic-44-wifi-book-transfer）：純本機
  # 算圖，不需要網路連線，適合手機熱點分享情境。
  qr_flutter: ^4.1.0
  # 螢幕常亮（epic-44-wifi-book-transfer）：WiFi 傳書畫面顯示中防止螢幕
  # 休眠中斷傳輸，對應 design.md「前景執行穩健度」承諾。
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.0
  flutter_inappwebview_platform_interface: ^1.3.0
  # flutter_secure_storage 測試替身：官方套件本身提供
  # TestFlutterSecureStoragePlatform（見 sync_account_repository_test.dart），
  # 需要這個 platform interface 套件才能取得 FlutterSecureStoragePlatform
  # 型別以設定 .instance。
  flutter_secure_storage_platform_interface: ^2.0.1
  wakelock_plus_platform_interface: ^1.6.0

# flutter_inappwebview_android 1.1.3 有 toMap() 無限遞迴 bug（line 198 呼叫
# ...toMap() 而非手動組裝 map），造成 InternalStoragePathHandler 使用時
# StackOverflow。本地 patch 修正此 bug，待上游修復後移除此 override。
dependency_overrides:
  flutter_inappwebview_android:
    path: patches/flutter_inappwebview_android

