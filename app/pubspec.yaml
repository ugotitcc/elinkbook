name: elinkbook
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # 整合測試使用 getTemporaryDirectory() 刪除暫存檔案。
  path_provider: ^2.1.6
  # 固定為 ^11.1.0 而非最新的 ^13.2.1：share_plus >=13.1.0 要求
  # win32 ^6.0.1，與現有 package_info_plus ^9.0.1（要求 win32 ^5.5.3）直接
  # 衝突；把 package_info_plus 升到 >=10.1.0 換取 win32 ^6.0.1 相容，則會
  # 改成跟 file_picker ^11.0.2（要求 win32 ^5.9.0）衝突，file_picker 要到
  # 12.x（beta）才支援 win32 ^6.x。三者無法在不動 file_picker／
  # package_info_plus 版本的前提下同時滿足，^11.1.0 是唯一不需連動升級這兩個
  # 與本功能無關套件的 share_plus 版本（`SharePlus.instance.share(
  # ShareParams(...))` 這個非淘汰 API 在此版本一樣存在）。未來若要升級
  # share_plus，須同時處理這條 win32 相依鏈。
  share_plus: ^11.1.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  package_info_plus: ^9.0.1
  flutter_inappwebview: ^6.1.5
  uuid: ^4.6.0
  crypto: ^3.0.7
  # PocketBase 同步（epic-8-sync）：官方 Dart SDK。
  pocketbase: ^0.24.0
  # 同步帳號憑證（authToken/userId/email）加密儲存，Android Keystore／
  # iOS Keychain（ADR 0019 決策 3，本專案首次引入的安全性相關儲存機制）。
  flutter_secure_storage: ^10.3.1
  # PDF 引擎（epic-24-pdf-engine-rebuild）：PDFium 透過 dart:ffi 直接呼叫，
  # 取代 android.graphics.pdf.PdfRenderer（ADR 0022）。
  pdfrx: ^2.4.6
  # PDF 導覽熱區（epic-24 Issue 8）_PdfNavZoneTapDetector 用 clock.now() 量測
  # 按壓時長：flutter_test 的 FakeAsync 會攔截 package:clock 的 Zone 覆寫，
  # 讓測試環境下的計時隨 tester.pump() 正確推進，同時正式裝置上一律取得真實
  # 系統時間（不像 SchedulerBinding.currentSystemFrameTimeStamp 只在畫面有新
  # frame 排程時才更新）。
  clock: ^1.1.2
  # CBZ 自然排序與壓縮檔重建（epic-11-multi-format-reader Issue 3）：
  # 由 dev_dependencies 升級為正式 dependency——先前僅供測試 fixture 產生
  # 使用（見 integration_test/foliate_epub_reader_view_test.dart），本 Issue
  # 起成為正式匯入管線的執行期依賴。
  archive: ^4.0.9
  # Markdown YAML Frontmatter 解析（epic-11-multi-format-reader Issue 5）。
  yaml: ^3.1.3
  # Markdown 解析（epic-11-multi-format-reader Issue 5）：Dart 官方純
  # Dart AST 解析器，用於 MD 匯入時的章節/標題階層抽取與 HTML 渲染。
  markdown: ^7.3.1
  # HTML5 容錯解析（epic-11-multi-format-reader Issue 5 審查修復，見
  # reviews/review-issue-5.md Critical #1）：`markdown` 套件對使用者輸入
  # 中裸 HTML（CommonMark/GFM 規範的 raw HTML passthrough）不會跳脫，
  # 用此套件把 `md.renderToHtml()` 的原始輸出容錯解析後重新序列化為合法
  # XML，確保章節 XHTML 一律可被 `epub.js` 的嚴格 XML 解析模式載入。
  html: ^0.15.6
  # OPDS Atom XML 解析（epic-30-calibre-remote-library Issue 1 起使用，
  # 本 Issue 先提升依賴層級）：原僅供測試驗證合成 EPUB 結構的 XML 格式，
  # 現升級為正式匯入管線的執行期依賴。
  xml: ^6.6.1
  # 遠端書庫 HTTP 通訊（epic-30-calibre-remote-library Issue 1 起使用，
  # 本 Issue 先提升依賴層級）：原僅供測試以 MockClient 取代真實網路請求，
  # 現升級為正式匯入管線的執行期依賴。
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  flutter_web_auth_2: ^5.1.0
  # TTS 語音朗讀（epic-34-tts-readalong Issue 2）：系統原生語音合成，見
  # dependency-spike-findings.md 已驗證與現有相依鏈無衝突（minSdk=24，
  # 未拉高專案現有下限）。
  flutter_tts: ^4.2.5
  # TTS 本機音訊播放（epic-34-tts-readalong Issue 2）：見
  # dependency-spike-findings.md，minSdk=16，未拉高專案現有下限。
  just_audio: ^0.10.6
  # TTS 背景播放與系統整合（epic-34-tts-readalong Issue 7）：前景服務、
  # 通知欄/鎖定畫面控制、耳機線控，見 dependency-spike-findings.md，
  # minSdk=19，未拉高專案現有下限。
  audio_service: ^0.18.19
  # TTS 音訊焦點中斷/耳機拔出事件（epic-34-tts-readalong Issue 7）：
  # audio_service 的既有相依，本專案額外顯式宣告以直接呼叫其 API
  # （AudioSession.instance／interruptionEventStream／
  # becomingNoisyEventStream），不依賴透過遞移相依隱式取用。
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  path_provider_platform_interface: ^2.1.0
  share_plus_platform_interface: ^6.1.0
  flutter_inappwebview_platform_interface: ^1.3.0
  # flutter_secure_storage 測試替身：官方套件本身提供
  # TestFlutterSecureStoragePlatform（見 sync_account_repository_test.dart），
  # 需要這個 platform interface 套件才能取得 FlutterSecureStoragePlatform
  # 型別以設定 .instance。
  flutter_secure_storage_platform_interface: ^2.0.1

# flutter_inappwebview_android 1.1.3 有 toMap() 無限遞迴 bug（line 198 呼叫
# ...toMap() 而非手動組裝 map），造成 InternalStoragePathHandler 使用時
# StackOverflow。本地 patch 修正此 bug，待上游修復後移除此 override。
dependency_overrides:
  flutter_inappwebview_android:
    path: patches/flutter_inappwebview_android

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - test/fixtures/sample.pdf
    - test/fixtures/sample_dual_page.pdf
    - test/fixtures/sample_pdf_toc.pdf
    - test/fixtures/sample_multi_page.pdf
    - test/fixtures/sample.epub
    - test/fixtures/sample.azw3
    - test/fixtures/sample_no_identifier.epub
    - test/fixtures/sample_horizontal.epub
    - test/fixtures/sample_fixed_layout.epub
    - test/fixtures/sample_long_vertical.epub
    - test/fixtures/sample_forced_linebreak_vertical.epub
    - test/fixtures/sample_fxl_svg_cover.epub
    - test/fixtures/sample_multi_chapter.epub
    - test/fixtures/issue9_vertical_pagejump.epub
    - test/fixtures/sample_declares_vertical.epub
    - test/fixtures/sample_long_chinese_vertical.epub
    - test/fixtures/sample.cbz
    - test/fixtures/sample_unpadded.cbz
    - test/fixtures/sample_synth.txt
    - test/fixtures/sample_big5.txt
    - test/fixtures/sample_utf8_chapters.txt
    - test/fixtures/sample_synth.md
    - test/fixtures/sample.md
    - test/fixtures/sample.ttf
    - assets/fonts/GuanKiapTsingKhai.ttf
    # 開發期暫停用（建置速度優化，其餘 4 款字型檔約 134MB）：檔案暫存於
    # tmp/fonts/（見 tmp/fonts/README.md 的恢復步驟），正式建置前需恢復。
    # - assets/fonts/SourceHanSansTC-VF.ttf
    # - assets/fonts/SourceHanSerifTC-VF.ttf
    # - assets/fonts/TaiwanPearl-Regular.ttf
    # - assets/fonts/GenRyuMinTW-Regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
