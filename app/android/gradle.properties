org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 8.11 不支援 JDK 25（Android Studio 3.5 內建 JBR 25），
# 指定 Microsoft OpenJDK 17 作為 Gradle 執行環境。
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.21.21-hotspot
# 保留原因：仍有 7 個外掛套用 KGP；移除條件見 patches/file_picker/PATCH.md；
# 這兩個開關是 AGP 9 的過渡用退出機制，日後 AGP 版本可能移除（確切版本未查證）。
android.builtInKotlin=false
android.newDsl=false
