org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# file_picker 的原生 Kotlin 模組（位於 C: 磁碟的 pub cache）與本專案（位於 U:
# 磁碟）跨磁碟機代號時，Kotlin 增量編譯器的 RelocatableFileToPathConverter
# 在計算相對路徑時會拋出「this and base files have different roots」而編譯
# 失敗（Windows 專屬的已知限制）。停用增量編譯以避免此問題；代價是重新編譯
# 會稍慢，但在本機開發環境下可接受。
kotlin.incremental=false
