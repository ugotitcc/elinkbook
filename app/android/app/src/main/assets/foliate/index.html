<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foliate Reader</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #fff; }
  foliate-view { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<foliate-view id="view"></foliate-view>
<script>
// Chrome 84 以前的 WebView 看不懂私有方法（#foo()）語法，改載入降級副本 ./legacy/
// （由 app/tool/foliate_legacy 產生）。新版 WebView 仍載入原始檔案，行為不變。
(function () {
  var m = /Chrome\/(\d+)/.exec(navigator.userAgent);
  var legacy = m && parseInt(m[1], 10) < 84;
  var s = document.createElement('script');
  s.type = 'module';
  s.crossOrigin = 'anonymous';
  s.src = (legacy ? './legacy/' : './') + 'main.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
